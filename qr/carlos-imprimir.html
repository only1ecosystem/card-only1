<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    width:1240px;height:1748px;background:#FAFAF8;color:#111111;
    font-family:"Poppins",sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:79px 87px;
    position:relative;overflow:hidden;
  }
  
  .marco{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;height:100%}
  .top{display:flex;align-items:baseline;justify-content:space-between;width:100%}
  .wordmark{font-size:77px;font-weight:800;letter-spacing:-.04em;line-height:1}
  .label{font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#6B6B6B}
  .codigo{
    margin-top:61px;padding:43px;
    background:#FAFAF8;border-radius:35px;
    /* en la version de imprimir el codigo va sobre papel cream: sin un
       marco que lo delimite, el lector no encuentra donde empieza */
    border:3px solid #111111;
  }
  .codigo svg{display:block;width:744px;height:744px}
  .escanea{
    margin-top:49px;
    font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
    color:#6B6B6B;display:flex;align-items:center;gap:10px;
  }
  .escanea::before,.escanea::after{content:"";width:62px;height:1px;background:#D8D5D0}
  .nombre{
    margin-top:38px;text-align:center;
    font-size:72px;font-weight:800;letter-spacing:-.04em;line-height:1.05;
  }
  .rol{
    margin-top:28px;
    font-size:26px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
    color:#6B6B6B;display:flex;align-items:center;gap:10px;
  }
  .rol::before{content:"";width:14px;height:14px;border-radius:50%;background:#A0223E}
  .pie{
    margin-top:auto;width:100%;padding-top:38px;
    border-top:1px solid #E4E2DE;
    display:flex;align-items:baseline;justify-content:space-between;
    font-size:26px;color:#6B6B6B;
  }
  .pie b{color:#111111;font-weight:700}
</style></head>
